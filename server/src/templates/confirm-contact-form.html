<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Contact Confirmation</title>
  </head>

  <body style="font-family: Arial, sans-serif; line-height: 1.6">
    <h2>Hello there! {{name}}</h2>

    <p>
      We have seen your message "{{subject}}" and we will respond shortly at
      {{email}}
    </p>

    <div>
      <a
        href="{{siteLink}}/products"
        style="
          display: inline-block;
          text-decoration: none;
          padding: 16px 24px;
          font-size: 16px;
          line-height: 1;
          border-radius: 4px;
          color: #fffffe;
          background-color: #020617;
        "
        class="hover-bg-slate-800"
      >
        <span style="mso-text-raise: 16px">View Our Products</span>
      </a>
    </div>
    <br />
    <p>Warm regards,</p>
    <p><strong>{{siteName}} Team</strong></p>
    <p>&copy; {{year}} {{siteName}}</p>
  </body>
</html>
