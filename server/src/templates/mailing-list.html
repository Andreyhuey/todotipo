<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>New Subscriber</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f6f6f6;
      padding: 20px;
    "
  >
    <div
      style="
        max-width: 600px;
        margin: auto;
        background: #ffffff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      "
    >
      <h2 style="color: #333">📬 New Mailing List Subscriber</h2>
      <p style="font-size: 16px; color: #555">
        You’ve got a new subscriber to your mailing list:
      </p>
      <p style="font-size: 18px; font-weight: bold; color: #111">{{email}}</p>
      <hr style="margin: 30px 0" />
      <p style="font-size: 14px; color: #999">
        This email was automatically generated by {{siteName}}.
      </p>
    </div>
  </body>
</html>
